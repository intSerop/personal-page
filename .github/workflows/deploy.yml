
name: Deploy MercyMed Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: hw6
        run: npm install

      - name: Build website
        working-directory: hw6
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p site

          # Copy the main homepage
          cp index.html site/

          # Copy previous assignments
          cp -R hw2 hw3 hw5 hw8 site/

          # Copy the built HW6 website
          mkdir -p site/hw6
          cp -R hw6/dist/. site/hw6/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
